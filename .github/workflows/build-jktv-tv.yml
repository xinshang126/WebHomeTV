name: Build JKTV TV Debug APK

on:
  push:
    branches: [jj-webhome-tv]

permissions:
  contents: read

concurrency:
  group: jktv-tv-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv-debug:
    if: github.repository == 'xinshang126/WebHomeTV' && github.ref == 'refs/heads/jj-webhome-tv'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set JKTV build version
        shell: bash
        run: |
          set -euo pipefail
          minor=$((GITHUB_RUN_NUMBER - 6))
          test "$minor" -ge 0
          echo "JKTV_VERSION_NAME=1.${minor}" >> "$GITHUB_ENV"
          echo "JKTV_VERSION_CODE=$((1000 + minor))" >> "$GITHUB_ENV"
          echo "JKTV_APK_BASENAME=JKTV-1.${minor}-leanback-arm64-debug" >> "$GITHUB_ENV"
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Install required SDK and native build tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Assemble Leanback ARM64 debug
        run: bash ./gradlew --no-daemon :app:assembleLeanbackArm64_v8aDebug
      - name: Verify television package and native contents
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find app/build/outputs/apk -type f -name '*leanback*arm64*debug.apk')
          test "${#candidates[@]}" -eq 1
          apk="${candidates[0]}"
          tools="$ANDROID_HOME/build-tools/37.0.0"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/aapt" dump badging "$apk" > jktv-badging.txt
          grep -q "^package: name='com.jktv.player' versionCode='${JKTV_VERSION_CODE}' versionName='${JKTV_VERSION_NAME}'" jktv-badging.txt
          grep -q "^leanback-launchable-activity:" jktv-badging.txt
          grep -q "^native-code: 'arm64-v8a'" jktv-badging.txt
          python3 - "$apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as f:
              entries = set(f.namelist())
          assert not any(p.startswith('assets/mpv-libs/') for p in entries)
          assert not any(p.startswith('lib/') and p.rsplit('/', 1)[-1] in {'libmpv.so','libplayer.so'} for p in entries)
          for lib in ('libijkffmpeg.so', 'libijkplayer.so', 'libijksdl.so'):
              assert f'lib/arm64-v8a/{lib}' in entries, lib
          PY
          mkdir -p dist
          cp "$apk" "dist/${JKTV_APK_BASENAME}.apk"
          cp jktv-badging.txt dist/
          (cd dist && sha256sum "${JKTV_APK_BASENAME}.apk" > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.JKTV_APK_BASENAME }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
