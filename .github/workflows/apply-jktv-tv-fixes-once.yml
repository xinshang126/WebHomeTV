name: Apply reviewed JKTV TV fixes

on:
  push:
    branches: [jj-webhome-tv]
    paths: ['.github/workflows/apply-jktv-tv-fixes-once.yml']

permissions: {}

jobs:
  apply:
    if: github.repository == 'xinshang126/WebHomeTV' && github.ref == 'refs/heads/jj-webhome-tv'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 3
      - name: Validate and apply the reviewed update
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = e025d6abb2611bf39f84836a41749d3a3bd40889
          test "$(git rev-parse HEAD^^)" = ea0c588dde890926b9245b6636351d3859a927f7
          p=JKTV-TV-build2-settings-ea0c588.patch
          printf '%s  %s\n' c10d32147520c7970949289e88c798d942f06c7a3844617cc2e694935b5b836b "$p" | sha256sum -c -
          git apply --index --check --whitespace=error "$p"
          git apply --index --whitespace=error "$p"
          git rm -r -- app/src/main/assets/lut_presets
          git rm -- "$p"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix JKTV TV folder navigation, branding and settings'
          git push origin HEAD:refs/heads/jj-webhome-tv
